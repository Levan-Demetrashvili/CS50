<!DOCTYPE html>

<html lang="en">

<head>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <title>Trivia!</title>
  <script>
    // TODO: Add code to check answers to questions
    document.addEventListener('DOMContentLoaded', () => {
      let messageText = document.querySelector('.message');
      let msgText = document.querySelector('.msg');

      document.querySelectorAll('.btn').forEach(button => {
        button.addEventListener('click', e => {
          document.querySelectorAll('.btn').forEach(btn => {
            btn.style.backgroundColor = '#d9edff';
          })
          let btnElement = e.target
          if (btnElement.classList.contains('correct')) {
            messageText.textContent = 'Correct!';
            messageText.style.color = 'green';
            btnElement.style.backgroundColor = 'green';
          } else {

            messageText.textContent = 'Incorrect!';
            messageText.style.color = 'red';
            btnElement.style.backgroundColor = 'red';
          }
        })
      })
      document.querySelector('form').addEventListener('submit', e => {
        e.preventDefault();
        inputEl = document.querySelector('input[name=response]')
        if (inputEl.value.toLowerCase() === 'switzerland') {
          msgText.textContent = 'Correct!';
          msgText.style.color = 'green';
          inputEl.style.backgroundColor = 'green';
        } else {
          msgText.textContent = 'Incorrect!';
          msgText.style.color = 'red';
          inputEl.style.backgroundColor = 'red';
        }
      })
    })
  </script>
</head>

<body>
  <div class="header">
    <h1>Trivia!</h1>
  </div>

  <div class="container">
    <div class="section">
      <h2>Part 1: Multiple Choice </h2>
      <hr>
      <!-- TODO: Add multiple choice question here -->
      <h3> What is the approximate ratio of people to sheep in New Zealand?</h3>
      <p class="message"></p>
      <button class="incorrect btn">6 people per 1 sheep</button>
      <button class="incorrect btn">4 people per 1 sheep</button>
      <button class="incorrect btn">1 person per 1 sheep</button>
      <button class="correct btn">1 person per 4 sheep</button>
      <button class="incorrect btn">1 person per 6 sheep</button>
    </div>

    <div class="section">
      <h2>Part 2: Free Response</h2>
      <hr>
      <!-- TODO: Add free response question here -->
      <h3>In which country is it illegal to own only one guinea pig, as a lone guinea pig might get lonely </h3>
      <p class="msg"> </p>
      <form>
        <input name="response" type="text" />
        <button> Check Answer</button>
      </form>
    </div>
  </div>
</body>

</html>
