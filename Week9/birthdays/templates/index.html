{% extends "layout.html" %}

{% block body %}
    <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>Add a Birthday</h2>
                <!-- TODO: Create a form for users to submit a name, a month, and a day -->
                 <form action="/" method="post">
                    <input autocomplete="off" autofocus name="friend" placeholder="Name" type = "text" />
                    <input autocomplete="off" name="month" placeholder="Month" type = "number" min="1" max="12" />
                    <input autocomplete="off" name="day" placeholder="Day" type = "number" min="1" max="31"/>
                    <button type="submit">Add Birthday</button>
                </form>
            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- TODO: Loop through the database entries to display them in this table -->
                         {% for friend in friends: %}
                            <tr>
                                <td> {{ friend["name"] }} </td>
                                <td> {{friend["month"]}}/{{friend["day"]}} </td>
                                <td>
                                    <form action="/delete" method="post">
                                        <input type="hidden" name="id" value="{{friend['id']}}" />
                                        <button type="submit"> Delete </button>
                                    </form>
                                </td>
                            </tr>
                         {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
{% endblock %}
